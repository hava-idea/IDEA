dataset:
  name: ucmerced
  root: /data/UCMerced_LandUse
  train_ratio: 0.70
  val_ratio: 0.15
  seed: 42

experiment:
  shots: 20
  token_budget: null
  max_new_tokens: 100
  device: cuda:0
  results_dir: ./results
  log_every: 50

model:
  model_path: /weights/InternVL2_5-8B
  torch_dtype: bfloat16
  load_in_8bit: false

pcma:
  sigma_sq: 1.0

sac:
  temperature: 0.07
  hard_negative_k: 5
  use_hard_negatives: true

calibration:
  use_structural: true

lsconv:
  vit_dim: 1024
  proj_dim: 128
  num_blocks: 2
  random_seed: 42
  structure_temperature: 0.07
  checkpoint_path: lsnet_t.pth

selection:
  alpha: 0.4
  beta: 0.3
  gamma: 0.2
  delta: 0.3
  omega1: 0.2
  omega2: 0.15
  adaptive: true

priors:
  hard_class_threshold: 0.5
  hard_negative_k: 5
