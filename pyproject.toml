[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "idea-rs"
version = "1.0.0"
description = "IDEA: Integrated Distribution-aware Exemplar Adaptation for Remote Sensing Many-Shot ICL"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "transformers>=4.37.0",
    "numpy>=1.24.0",
    "faiss-cpu>=1.7.4",
    "Pillow>=9.0.0",
    "pyyaml>=6.0",
    "tqdm>=4.65.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov"]
gpu = ["faiss-gpu>=1.7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
